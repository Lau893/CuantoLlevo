<title>Cuánto llevo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna tipo app móvil; cada cuenta es una fila con su contador vivo; hoja inferior para crear y ver detalle */
/* La app es solo blanco, negro y grises; el único color lo pone cada cuenta (--c-*) */
:root {
  --bg: #F2F2F2;
  --bg-grad: linear-gradient(180deg, #FFFFFF 0%, #EDEDED 100%);
  --surface: #FFFFFF;
  --fg: #111111;
  --muted: #666666;
  --line: #D6D6D6;
  --accent: #111111;
  --accent-ink: #FFFFFF;
  --danger: #111111;
  --scrim: rgba(0, 0, 0, .45);
  --shadow: rgba(0, 0, 0, .18);
  --c-rojo: #D93A3A; --c-naranja: #DB7110; --c-amarillo: #B08A00; --c-verde: #2E9E4F;
  --c-turquesa: #0D93A0; --c-azul: #2F6BE0; --c-violeta: #7B4AE0; --c-rosa: #D13E8A;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0C; --bg-grad: linear-gradient(180deg, #1A1A1A 0%, #0A0A0A 100%);
    --surface: #171717; --fg: #F2F2F2; --muted: #9A9A9A; --line: #2E2E2E;
    --accent: #F2F2F2; --accent-ink: #0C0C0C; --danger: #F2F2F2;
    --scrim: rgba(0,0,0,.65); --shadow: rgba(0,0,0,.5);
    --c-rojo: #FF6B6B; --c-naranja: #FFA24D; --c-amarillo: #FFD84D; --c-verde: #5BD37E;
    --c-turquesa: #4FD6E0; --c-azul: #7FA4FF; --c-violeta: #B394FF; --c-rosa: #FF7EBF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0C; --bg-grad: linear-gradient(180deg, #1A1A1A 0%, #0A0A0A 100%);
  --surface: #171717; --fg: #F2F2F2; --muted: #9A9A9A; --line: #2E2E2E;
  --accent: #F2F2F2; --accent-ink: #0C0C0C; --danger: #F2F2F2;
  --scrim: rgba(0,0,0,.65); --shadow: rgba(0,0,0,.5);
  --c-rojo: #FF6B6B; --c-naranja: #FFA24D; --c-amarillo: #FFD84D; --c-verde: #5BD37E;
  --c-turquesa: #4FD6E0; --c-azul: #7FA4FF; --c-violeta: #B394FF; --c-rosa: #FF7EBF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed; color: var(--fg); font: 400 1rem/1.5 var(--body); }
.app { max-width: 34rem; margin: 0 auto; padding: 0 16px; padding-block: 1.25rem 7rem; display: flex; flex-direction: column; gap: 1.5rem; }
header h1 { font: 700 2.25rem/1 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
header p { margin: .4rem 0 0; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: .75rem; }
.item {
  display: grid; gap: .35rem; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  border-radius: 14px; padding: 1rem 1.1rem; font: inherit;
}
.item, .sheet { --c: var(--fg); }
.item:hover { border-color: var(--c); }
.item-name { font: 600 1.05rem/1.3 var(--body); overflow-wrap: anywhere; display: flex; align-items: center; gap: .5rem; min-width: 0; }
.dot { flex: none; width: .8rem; height: .8rem; border-radius: 50%; background: var(--c); }
.item-big { color: var(--c); font: 600 1.6rem/1.15 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.item-big small { font-size: .55em; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: .15em; }
.item-meta { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; align-items: baseline; }
.chip { font: 600 .72rem/1 var(--body); letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .3rem .55rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.hot { color: var(--c); border-color: var(--c); }
.swatches { display: flex; flex-wrap: wrap; gap: .55rem; border: 0; margin: 0; padding: 0; }
.swatches legend { font-weight: 500; font-size: .9rem; padding: 0; margin-bottom: .45rem; }
.swatch { position: relative; width: 2.4rem; height: 2.4rem; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.swatch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.swatch i { width: 100%; height: 100%; border-radius: 50%; background: var(--sw); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatch input:checked + i { box-shadow: 0 0 0 2.5px var(--fg); }
.swatch input:focus-visible + i { outline: 3px solid var(--fg); outline-offset: 3px; }
.resets { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: .7rem; }
.resets b { font: 600 1.45rem/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--c); }
.resets span { font-weight: 600; }
.resets em { font-style: normal; color: var(--muted); font-size: .82rem; margin-left: auto; }
.item-sub { font: 400 .78rem/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 2rem 1.25rem; text-align: center; color: var(--muted); display: grid; gap: .5rem; }
.empty strong { font: 700 1.25rem/1.2 var(--display); color: var(--fg); }
.empty .clock { font: 600 1.6rem/1 var(--mono); color: var(--fg); opacity: .35; }
.fab-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 1rem 16px calc(1rem + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 40%); display: flex; justify-content: center; pointer-events: none; }
.btn { font: 600 1rem/1 var(--body); border-radius: 999px; padding: .95rem 1.4rem; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-danger.solid { background: var(--danger); color: var(--surface); }
.fab-bar .btn { pointer-events: auto; width: 100%; max-width: 34rem; font-size: 1.05rem; box-shadow: 0 6px 20px var(--shadow); }
.btn:focus-visible, .item:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { font-size: .8rem; color: var(--muted); text-align: center; margin: 0; }

/* hoja inferior */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--surface); width: 100%; max-width: 34rem; border-radius: 20px 20px 0 0; padding: 1.4rem 16px calc(1.4rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 1rem; max-height: 92%; overflow-y: auto; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h2 { font: 700 1.5rem/1.15 var(--display); margin: 0; overflow-wrap: anywhere; text-wrap: balance; display: flex; align-items: center; gap: .6rem; }
.sheet h2 .dot { width: 1rem; height: 1rem; }
.sheet { border-top: 4px solid var(--c); }
label { display: grid; gap: .35rem; font-weight: 500; font-size: .9rem; }
input[type="text"], input[type="datetime-local"] { font: 400 1rem var(--body); padding: .8rem .9rem; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0; }
.toggle { display: flex; align-items: center; gap: .6rem; font-weight: 400; font-size: .9rem; color: var(--muted); }
.row { display: flex; gap: .6rem; flex-wrap: wrap; }
.row .btn { flex: 1 1 8rem; }
.err { color: var(--danger); font-size: .85rem; margin: 0; }

/* detalle */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .5rem; }
.cell { background: var(--bg); border-radius: 10px; padding: .7rem .5rem; text-align: center; }
.cell b { display: block; font: 600 1.45rem/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.cell span { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.totals { display: grid; gap: .25rem; font: 400 .82rem/1.5 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.totals b { color: var(--fg); font-weight: 600; }
.since { color: var(--muted); font-size: .9rem; margin: -.5rem 0 0; }
.confirm { border: 1px solid var(--danger); border-radius: 12px; padding: .9rem; display: grid; gap: .7rem; }
.confirm p { margin: 0; font-size: .92rem; }
</style>

<div class="app">
  <header>
    <h1>Cuánto llevo</h1>
    <p id="subtitle">Cada cuenta empieza a correr en el momento en que la creás.</p>
  </header>
  <section class="list" id="list" aria-live="polite"></section>
  <p class="note" id="storageNote" hidden></p>
</div>

<div class="fab-bar"><button class="btn btn-primary" id="newBtn" type="button">+ Nueva cuenta</button></div>

<!-- Crear -->
<div class="scrim" id="newScrim" hidden>
  <form class="sheet" id="newForm" novalidate>
    <h2>Nueva cuenta</h2>
    <label for="nameInput">¿Qué querés contar?
      <input type="text" id="nameInput" maxlength="60" placeholder="Ej: Sin fumar, Juntos, En el trabajo nuevo" autocomplete="off">
    </label>
    <fieldset class="swatches" id="newSwatches"><legend>Color</legend></fieldset>
    <label class="toggle" for="pastToggle"><input type="checkbox" id="pastToggle"> Empezó antes (elegir fecha y hora)</label>
    <label for="startInput" id="startWrap" hidden>Fecha de inicio
      <input type="datetime-local" id="startInput">
    </label>
    <p class="err" id="newErr" hidden></p>
    <div class="row">
      <button type="button" class="btn btn-ghost" id="cancelNew">Cancelar</button>
      <button type="submit" class="btn btn-primary" id="createBtn">Empezar a contar</button>
    </div>
  </form>
</div>

<!-- Detalle -->
<div class="scrim" id="detScrim" hidden>
  <div class="sheet" id="detSheet" role="dialog" aria-labelledby="detName">
    <h2><span class="dot"></span><span id="detName"></span></h2>
    <p class="since" id="detSince"></p>
    <div class="grid" id="detGrid"></div>
    <div class="resets" id="detResets"></div>
    <div class="totals" id="detTotals"></div>
    <fieldset class="swatches" id="detSwatches"><legend>Color de la cuenta</legend></fieldset>
    <div class="confirm" id="confirmBox" hidden>
      <p id="confirmText"></p>
      <div class="row">
        <button type="button" class="btn btn-ghost" id="confirmNo">No</button>
        <button type="button" class="btn btn-danger solid" id="confirmYes"></button>
      </div>
    </div>
    <div class="row" id="detActions">
      <button type="button" class="btn btn-ghost" id="resetBtn">Reiniciar a cero</button>
      <button type="button" class="btn btn-danger" id="deleteBtn">Borrar</button>
    </div>
    <button type="button" class="btn btn-primary" id="closeDet">Listo</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LS_KEY = "cuanto-llevo:cuentas";
  let counters = [];          // {id, name, start (ms), created (ms)}
  let store = null;           // {save(c), remove(id)}
  let openId = null;
  let pending = null;         // "reset" | "delete"

  // ---------- tiempo ----------
  function breakdown(start, now) {
    const a = new Date(start), b = new Date(now);
    if (b < a) return { y:0, mo:0, d:0, h:0, mi:0, s:0 };
    let y = b.getFullYear() - a.getFullYear();
    let mo = b.getMonth() - a.getMonth();
    let anchor = () => { const t = new Date(a); t.setFullYear(a.getFullYear() + y); t.setMonth(a.getMonth() + mo); return t; };
    if (mo < 0) { y--; mo += 12; }
    let t = anchor();
    while (t > b) { mo--; if (mo < 0) { y--; mo += 12; } t = anchor(); }
    let rest = Math.floor((b - t) / 1000);
    const d = Math.floor(rest / 86400); rest -= d * 86400;
    const h = Math.floor(rest / 3600); rest -= h * 3600;
    const mi = Math.floor(rest / 60); const s = rest - mi * 60;
    return { y, mo, d, h, mi, s };
  }
  const pad = n => String(n).padStart(2, "0");
  const plural = (n, one, many) => n === 1 ? one : many;
  function headline(c, now) {
    const sec = Math.max(0, Math.floor((now - c.start) / 1000));
    const days = Math.floor(sec / 86400);
    const r = sec % 86400;
    const clock = `${pad(Math.floor(r / 3600))}:${pad(Math.floor(r % 3600 / 60))}:${pad(r % 60)}`;
    return days > 0
      ? `${days.toLocaleString("es-AR")}<small>${plural(days, "día", "días")}</small> ${clock}`
      : clock;
  }
  function subline(c, now) {
    const b = breakdown(c.start, now);
    const parts = [];
    if (b.y) parts.push(`${b.y} ${plural(b.y, "año", "años")}`);
    if (b.mo) parts.push(`${b.mo} ${plural(b.mo, "mes", "meses")}`);
    if (b.d || parts.length) parts.push(`${b.d} ${plural(b.d, "día", "días")}`);
    parts.push(`${b.h} h ${b.mi} min`);
    return parts.join(" · ");
  }
  const resetLabel = n => (n = n || 0) === 0 ? "Sin reinicios" : `${n} ${plural(n, "reinicio", "reinicios")}`;
  const fmtDate = ms => new Date(ms).toLocaleString("es-AR", { dateStyle: "long", timeStyle: "short" });
  const COLORS = [["rojo","Rojo"],["naranja","Naranja"],["amarillo","Amarillo"],["verde","Verde"],
                  ["turquesa","Turquesa"],["azul","Azul"],["violeta","Violeta"],["rosa","Rosa"]];
  const colorVar = k => COLORS.some(([key]) => key === k) ? `var(--c-${k})` : "var(--fg)";
  function buildSwatches(box, group) {
    box.insertAdjacentHTML("beforeend", COLORS.map(([k, label]) =>
      `<label class="swatch" style="--sw: var(--c-${k})"><input type="radio" name="${group}" id="${group}-${k}" value="${k}" aria-label="${label}"><i></i></label>`).join(""));
  }
  const checkedColor = group => (document.querySelector(`input[name="${group}"]:checked`) || {}).value;
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));

  // ---------- render ----------
  function renderList() {
    const now = Date.now();
    const list = $("list");
    if (!counters.length) {
      list.innerHTML = `<div class="empty"><span class="clock">00:00:00</span><strong>Todavía no tenés cuentas</strong><span>Tocá “Nueva cuenta”, ponele un nombre y el reloj arranca en ese mismo segundo.</span></div>`;
      return;
    }
    const sorted = [...counters].sort((a, b) => b.created - a.created);
    list.innerHTML = sorted.map(c => `
      <button type="button" class="item" data-id="${esc(c.id)}" style="--c: ${colorVar(c.color)}">
        <span class="item-meta"><span class="item-name"><span class="dot"></span>${esc(c.name)}</span><span class="chip${c.resets ? " hot" : ""}" data-chip>${resetLabel(c.resets)}</span></span>
        <span class="item-big" data-big>${headline(c, now)}</span>
        <span class="item-sub" data-sub>${subline(c, now)}</span>
      </button>`).join("");
  }
  function tickList() {
    const now = Date.now();
    document.querySelectorAll(".item").forEach(el => {
      const c = counters.find(x => x.id === el.dataset.id);
      if (!c) return;
      el.querySelector("[data-big]").innerHTML = headline(c, now);
      el.querySelector("[data-sub]").textContent = subline(c, now);
    });
  }
  function renderDetail() {
    const c = counters.find(x => x.id === openId);
    if (!c) { closeDetail(); return; }
    const now = Date.now();
    const b = breakdown(c.start, now);
    $("detName").textContent = c.name;
    $("detSheet").style.setProperty("--c", colorVar(c.color));
    document.querySelectorAll('input[name="detColor"]').forEach(i => { i.checked = i.value === c.color; });
    $("detSince").textContent = `Desde el ${fmtDate(c.start)}`;
    const r = c.resets || 0;
    $("detResets").innerHTML = `<b>${r}</b><span>${plural(r, "reinicio", "reinicios")}</span>` +
      `<em>${r ? "Creada el " + fmtDate(c.created) : "Nunca la reiniciaste"}</em>`;
    $("detGrid").innerHTML = [
      [b.y, "años"], [b.mo, "meses"], [b.d, "días"],
      [b.h, "horas"], [b.mi, "minutos"], [b.s, "segundos"]
    ].map(([n, l]) => `<div class="cell"><b>${n}</b><span>${l}</span></div>`).join("");
    const sec = Math.max(0, Math.floor((now - c.start) / 1000));
    const f = n => Math.floor(n).toLocaleString("es-AR");
    $("detTotals").innerHTML =
      `<div>En total: <b>${f(sec / 86400)}</b> días</div>` +
      `<div><b>${f(sec / 3600)}</b> horas · <b>${f(sec / 60)}</b> minutos</div>` +
      `<div><b>${f(sec)}</b> segundos</div>`;
  }

  setInterval(() => { tickList(); if (openId) renderDetail(); }, 1000);

  // ---------- crear ----------
  function toLocalInput(ms) {
    const d = new Date(ms); d.setSeconds(0, 0);
    return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }
  buildSwatches($("newSwatches"), "newColor");
  buildSwatches($("detSwatches"), "detColor");
  $("newSwatches").addEventListener("change", () => $("newForm").style.setProperty("--c", colorVar(checkedColor("newColor"))));
  $("detSwatches").addEventListener("change", async () => {
    const c = counters.find(x => x.id === openId); if (!c) return;
    c.color = checkedColor("detColor");
    renderList(); renderDetail();
    try { await store.save(c); } catch (err) { flash("No se pudo guardar el color. Probá de nuevo."); }
  });
  $("newBtn").addEventListener("click", () => {
    $("newForm").reset();
    const used = new Set(counters.map(c => c.color));
    const pick = (COLORS.find(([k]) => !used.has(k)) || COLORS[counters.length % COLORS.length])[0];
    $("newColor-" + pick).checked = true;
    $("newForm").style.setProperty("--c", colorVar(pick));
    $("startWrap").hidden = true;
    $("newErr").hidden = true;
    $("startInput").max = toLocalInput(Date.now());
    $("newScrim").hidden = false;
    $("nameInput").focus();
  });
  $("cancelNew").addEventListener("click", () => { $("newScrim").hidden = true; });
  $("pastToggle").addEventListener("change", e => {
    $("startWrap").hidden = !e.target.checked;
    if (e.target.checked && !$("startInput").value) $("startInput").value = toLocalInput(Date.now());
  });
  $("newForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("nameInput").value.trim();
    const showErr = msg => { $("newErr").textContent = msg; $("newErr").hidden = false; };
    if (!name) return showErr("Escribí un nombre para la cuenta.");
    const now = Date.now();
    let start = now;
    if ($("pastToggle").checked) {
      const v = $("startInput").value;
      start = v ? new Date(v).getTime() : NaN;
      if (isNaN(start)) return showErr("Elegí una fecha y hora válidas.");
      if (start > now) return showErr("La fecha de inicio no puede estar en el futuro.");
    }
    const c = { id: "c" + now.toString(36) + Math.random().toString(36).slice(2, 7), name, start, created: now, resets: 0, color: checkedColor("newColor") || "rojo" };
    counters.push(c);
    $("newScrim").hidden = true;
    renderList();
    try { await store.save(c); } catch (err) { flash("No se pudo guardar la cuenta. Revisá tu conexión y probá de nuevo."); }
  });

  // ---------- detalle ----------
  $("list").addEventListener("click", e => {
    const el = e.target.closest(".item"); if (!el) return;
    openId = el.dataset.id; pending = null;
    $("confirmBox").hidden = true; $("detActions").hidden = false;
    renderDetail();
    $("detScrim").hidden = false;
  });
  function closeDetail() { openId = null; $("detScrim").hidden = true; }
  $("closeDet").addEventListener("click", closeDetail);
  [$("newScrim"), $("detScrim")].forEach(s => s.addEventListener("click", e => {
    if (e.target === s) { s.hidden = true; if (s.id === "detScrim") openId = null; }
  }));
  function ask(kind) {
    pending = kind;
    $("confirmText").textContent = kind === "reset"
      ? `La cuenta vuelve a cero y empieza a correr desde ahora. Va a ser el reinicio n.º ${((counters.find(x => x.id === openId) || {}).resets || 0) + 1}. ¿Seguro?`
      : "Se borra esta cuenta para siempre. ¿Seguro?";
    $("confirmYes").textContent = kind === "reset" ? "Sí, reiniciar" : "Sí, borrar";
    $("confirmBox").hidden = false; $("detActions").hidden = true;
  }
  $("resetBtn").addEventListener("click", () => ask("reset"));
  $("deleteBtn").addEventListener("click", () => ask("delete"));
  $("confirmNo").addEventListener("click", () => { pending = null; $("confirmBox").hidden = true; $("detActions").hidden = false; });
  $("confirmYes").addEventListener("click", async () => {
    const c = counters.find(x => x.id === openId); if (!c) return;
    $("confirmBox").hidden = true; $("detActions").hidden = false;
    try {
      if (pending === "reset") {
        c.start = Date.now();
        c.resets = (c.resets || 0) + 1;
        renderList(); renderDetail();
        await store.save(c);
      } else {
        counters = counters.filter(x => x.id !== c.id);
        closeDetail(); renderList();
        await store.remove(c.id);
      }
    } catch (err) { flash("No se pudo guardar el cambio. Probá de nuevo."); }
    pending = null;
  });

  function flash(msg) { const n = $("storageNote"); n.textContent = msg; n.hidden = false; }

  // ---------- almacenamiento ----------
  function localStore() {
    const write = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(counters)); } catch (e) {} };
    return { save: async () => write(), remove: async () => write() };
  }
  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); counters = raw ? JSON.parse(raw) : []; } catch (e) { counters = []; }
    store = localStore();
    renderList();
  }

  async function boot() {
    loadLocal();
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const uid = db && user ? await user.id() : null;
      if (!uid) { flash("Tus cuentas se guardan solo en este dispositivo."); return; }
      const col = db.collection("data/users/" + uid);
      store = {
        save: c => col.doc(c.id).set({ name: c.name, start: c.start, created: c.created, resets: c.resets || 0, color: c.color || "" }),
        remove: id => col.doc(id).delete()
      };
      col.onSnapshot(snap => {
        counters = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderList();
        if (openId) renderDetail();
      }, () => flash("Se perdió la conexión con tus cuentas. Recargá la página."));
    } catch (e) {
      flash("Tus cuentas se guardan solo en este dispositivo.");
    }
  }
  boot();
})();
</script>
